<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Price Oracle | AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <div class="glass-card">
            <header>
                <div class="status-badge">Mobile AI Engine v3.0 Online</div>
                <h1>Mobile Price <span>Oracle</span></h1>
                <p>Smart Valuation for the Next-Gen Smartphones</p>
            </header>

            <form action="/predict/mobile" method="POST">
                <div class="form-grid">
                    <div class="input-group">
                        <label><i class="fa-solid fa-copyright"></i> Brand Category</label>
                        <select name="brand_tier">
                            <option value="2" {% if form_data and form_data.brand_tier == '2' %}selected{% endif %}>Premium (Apple, Samsung, Google)</option>
                            <option value="1" {% if form_data and form_data.brand_tier == '1' %}selected{% endif %}>Mid-Premium (OnePlus, Vivo, Oppo, iQOO)</option>
                            <option value="0" {% if form_data and form_data.brand_tier == '0' %}selected{% endif %}>Value/Budget (Others)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-microchip"></i> Processor Class</label>
                        <select name="processor_score">
                            <option value="5" {% if form_data and form_data.processor_score == '5' %}selected{% endif %}>Ultra-Flagship (8 Elite, A19 Pro)</option>
                            <option value="4" {% if form_data and form_data.processor_score == '4' %}selected{% endif %}>High-End (8 Gen 3, A18)</option>
                            <option value="3" {% if form_data and form_data.processor_score == '3' %}selected{% endif %}>Mid-Range (Dimensity 8/7 Gen)</option>
                            <option value="2" {% if form_data and form_data.processor_score == '2' %}selected{% endif %}>Budget 5G (G99, 4 Gen)</option>
                            <option value="1" {% if form_data and form_data.processor_score == '1' %}selected{% endif %}>Entry Level</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-memory"></i> RAM (GB)</label>
                            <input type="number" name="ram" value="{{ form_data.ram if form_data else '8' }}" min="2" max="24">                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-battery-three-quarters"></i> Battery (mAh)</label>
                                <input type="number" name="battery" value="{{ form_data.battery if form_data else '5000' }}" step="100">                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-camera"></i> Back Camera (MP)</label>
                            <input type="number" name="camera" value="{{ form_data.camera if form_data else '50' }}">                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-calendar-days"></i> Launch Year</label>
                        <input type="number" name="year" value="{{ form_data.year if form_data else '2025' }}">                    </div>
                </div>

                <div class="wide-section">
                    <div class="input-group">
                        <label><i class="fa-solid fa-mobile-screen-button"></i> Display Size (Inches)</label>
                            <input type="number" step="0.01" name="screen" value="{{ form_data.screen if form_data else '6.7' }}" placeholder="e.g. 6.67">                    </div>
                </div>

                <button type="submit" class="predict-btn">
                    Calculate Mobile Valuation <i class="fa-solid fa-chevron-right"></i>
                </button>
            </form>

            {% if result %}
            <div class="result-display animate-up">
                <span class="label">ESTIMATED MARKET PRICE</span>
                <div class="price-value">{{ result }}</div>
                <p class="disclaimer">Based on current Indian Market Trends (2026).</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
